<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">

    <title>Cadastro</title>
</head>

<body >
    <div id="cadastro">
    <h1>Cadastro</h1>
    
        <form action="">
            <fieldset>
                <legend>Informações pessoais</legend>
                <label for="nome">Nome</label>
                <input type="text" name="nome" id="nome" placeholder="Seu nome completo">
    
                <label for="sexo">Sexo:</label>
                <div class="sexo-container">
                    <label for="mascu">Masculino</label>
                    <input type="radio" name="sexo" id="mascu">
                    <label for="fem">Feminino</label>
                    <input type="radio" name="sexo" id="fem">
                    <label for="nInforma">Prefiro não informar</label>
                    <input type="radio" name="sexo" id="nInforma">
                </div>
    
                <label for="obs">Observações</label>
                <textarea name="obs" id="obs" cols="30" rows="10"></textarea>
    
                <label for="email">Email</label>
                <input type="email" name="email" id="email" placeholder="email@email.com">
    
                <label for="senha">Senha</label>
                <input type="password" name="senha" id="senha">
    
                <label for="confSenha">Confirmar senha</label>
                <input type="password" name="confSenha" id="confSenha">
    
                <button type="submit" onclick="alert('Cadastrado com sucesso')">Cadastrar</button>
                <button type="reset">Apagar</button>
            </fieldset>
        </form>
        <a href="login.html" class="Voltar">Voltar</a>
    </div>
</body>

</html>

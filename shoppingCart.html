<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">

    <title>Document</title>
</head>

<body>
    <!--Cabeçalho-->
    <div id="cabecalho">
        <a class="logo" href="telaPrincipal.html">
            <img src="img/DISCOOL_logo.png" alt="home">
        </a>
        <div class="botoes">
            <a class="botaoCabecalho" href="forms/login.html">Sair</a>
            <a class="botaoCabecalho" href="sobre.html">Sobre</a>
            <a class="botaoCarrinho" href="/shoppingCart.html">
                <img src="img/shopping-cart.png" alt="Carrinho" width="40">
            </a>
        </div>
    </div>

    <!--Carrinho-->
    <div id="carrinho">
        <table>
            <caption>
                <h1>Suas Compras</h1>
            </caption>
            <thead>
                <tr>
                    <th>Discos</th>
                    <th>Valor</th>
                    <th>Total</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td><img src="produtos/coldplay/img/coldplayMusicOftheSpheres.png" alt="Coldplay" width="100"></td>
                    <td>R$80,00</td>
                    <td rowspan="2">R$160,00</td>
                </tr>
                <tr>
                    <td><img src="produtos/ghost/img/ghostPrequelle.jpg" alt="Ghost" width="100"></td>
                    <td>R$80,00</td>
                </tr>
            </tbody>
        </table>
        <br>
        <div class="acao">
            <button onclick="alert('Compra finalizada')">Finalizar Compra</button>
        </div>
    </div>
</body>

</html>
